name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write # push the image to ghcr.io on main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

      # -short cuts the simulator's seed sweeps to a tenth: the race detector
      # slows the single-goroutine simulator several times over without
      # anything to find there. The full sweeps run in the jobs below.
      - name: unit tests (race detector, short sweeps)
        run: go test -race -short ./...

  sim-tests:
    # The simulator's tests with their full seed counts, without -race.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: simulator tests (full sweeps)
        run: go test ./sim/... ./server/host/...

  sim-sweep:
    # At least 1,000 simulated seeds per push (CLAUDE.md section 8), with
    # fixed and with changing membership. A failing seed's trace is uploaded
    # so it can be replayed and inspected.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode:
          - { name: fixed, flags: "" }
          - { name: membership, flags: "-membership" }
          - { name: batched, flags: "-batch" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build simulator
        run: go build -o bin/stormproof-sim ./sim/cmd/stormproof-sim
      # Seeds run on every CPU (-parallel defaults to the CPU count); each
      # seed's run, and the output, are the same as running them one by one.
      - name: 1,000 seeds, all fault profiles (${{ matrix.mode.name }})
        shell: bash # -o pipefail, so tee doesn't hide the simulator's exit code
        run: bin/stormproof-sim -seeds 1000 -profile all ${{ matrix.mode.flags }} -trace-dir traces | tee sweep.log
      - name: summary
        if: always()
        shell: bash
        run: |
          {
            echo "### sim-sweep (${{ matrix.mode.name }})"
            echo '```'
            tail -n 1 sweep.log 2>/dev/null || echo "(no output)"
            grep -E '^seed |^  replay: ' sweep.log 2>/dev/null | head -n 60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload failing traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failing-traces-${{ matrix.mode.name }}
          path: traces/
          if-no-files-found: ignore
          retention-days: 30

  proto:
    # Generated code is committed so `go build` needs no protobuf toolchain.
    # This job regenerates it and fails if the result differs from the repo.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Building buf takes about a minute and downloads ~100 modules, any of
      # which can fail on a network hiccup. Cache the built tools; the key
      # changes whenever a tool version in the Makefile changes.
      - name: cache code generation tools
        uses: actions/cache@v4
        with:
          path: bin
          key: proto-tools-${{ runner.os }}-${{ hashFiles('Makefile', 'go.mod') }}

      - name: regenerate
        run: make proto

      - name: check generated code is up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated code is stale. Run 'make proto' and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi

  docker:
    # Build the image and run the docker-compose smoke test (3 servers: kill
    # the leader, keep writing, bring it back). On main, also push the image
    # to the GitHub Container Registry.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -f deploy/docker/Dockerfile -t stormproof:latest .
      - name: docker-compose smoke test
        run: deploy/docker/smoke.sh
      - name: push to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag stormproof:latest "$image:latest"
          docker tag stormproof:latest "$image:${{ github.sha }}"
          docker push "$image:latest"
          docker push "$image:${{ github.sha }}"

  visualizer:
    # The trace visualizer: unit tests (which also replay every example
    # trace) and a production build.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: visualizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: visualizer/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: tests
        run: npm test
      - name: build
        run: npm run build

  deploy-config:
    # The deployment configuration stays valid: Terraform formatted and
    # valid (no AWS credentials needed for either), and both Kubernetes
    # overlays render. Nothing is applied anywhere.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
      - name: terraform fmt
        run: terraform -chdir=deploy/terraform fmt -check -recursive
      - name: terraform validate
        run: |
          terraform -chdir=deploy/terraform init -backend=false -input=false
          terraform -chdir=deploy/terraform validate
      - name: render the Kubernetes overlays
        run: |
          kubectl kustomize deploy/k8s/overlays/local > /dev/null
          kubectl kustomize deploy/k8s/overlays/aws > /dev/null
      - name: shell scripts parse
        run: for f in deploy/k8s/chaos.sh bench/*.sh deploy/docker/smoke.sh; do bash -n "$f"; done
