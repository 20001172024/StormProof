# A 3-server StormProof cluster with Prometheus, on one machine.
#
#   docker compose -f deploy/docker/docker-compose.yml up -d --build --wait
#   docker compose -f deploy/docker/docker-compose.yml run --rm cli put greeting hello
#   docker compose -f deploy/docker/docker-compose.yml down -v      # -v also deletes the data volumes
#
# Ports on the host: node i serves gRPC on 7000+i and metrics on 9100+i;
# Prometheus is on 9090. Run the CLI through the `cli` service rather than
# from the host: servers point clients at the leader by its address inside
# the compose network (node2:7000), which the host can't resolve.
# (docker-compose.5.yml is the 5-server version.)

name: stormproof

x-node: &node
  image: stormproof:latest
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile
  healthcheck:
    # Ready once the server knows a leader.
    test: ["CMD", "wget", "-qO-", "http://localhost:9090/readyz"]
    interval: 2s
    timeout: 2s
    retries: 30

services:
  node1:
    <<: *node
    hostname: node1
    command: ["-id", "1", "-cluster", "1=node1:7000,2=node2:7000,3=node3:7000", "-data", "/data", "-metrics", ":9090"]
    volumes: ["node1-data:/data"]
    ports: ["7001:7000", "9101:9090"]

  node2:
    <<: *node
    hostname: node2
    command: ["-id", "2", "-cluster", "1=node1:7000,2=node2:7000,3=node3:7000", "-data", "/data", "-metrics", ":9090"]
    volumes: ["node2-data:/data"]
    ports: ["7002:7000", "9102:9090"]

  node3:
    <<: *node
    hostname: node3
    command: ["-id", "3", "-cluster", "1=node1:7000,2=node2:7000,3=node3:7000", "-data", "/data", "-metrics", ":9090"]
    volumes: ["node3-data:/data"]
    ports: ["7003:7000", "9103:9090"]

  cli:
    image: stormproof:latest
    profiles: ["tools"]
    entrypoint: ["stormproof-cli"]
    environment:
      STORMPROOF_ENDPOINTS: "node1:7000,node2:7000,node3:7000"

  # The load generator (bench/): writes results to ./results on the host.
  #   docker compose -f deploy/docker/docker-compose.yml run --rm bench -clients 16 -reads 0.5
  bench:
    image: stormproof:latest
    profiles: ["tools"]
    entrypoint: ["stormproof-bench"]
    user: "0"
    working_dir: /results
    volumes: ["./results:/results"]
    environment:
      STORMPROOF_ENDPOINTS: "node1:7000,node2:7000,node3:7000"

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["../monitoring/prometheus-3.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

volumes:
  node1-data:
  node2-data:
  node3-data:
