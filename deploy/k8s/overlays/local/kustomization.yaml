# A local cluster (k3s in Docker, kind, ...) with the image built locally
# and loaded into it; see deploy/k8s/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../../monitoring
images:
  - name: stormproof
    newName: stormproof
    newTag: latest
patches:
  # The image is loaded into the cluster, never pulled.
  - target:
      kind: StatefulSet
      name: stormproof
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
