# The StormProof cluster: 3 servers in a StatefulSet, a headless Service
# for peer discovery, a Service for clients, and a PodDisruptionBudget.
# Deploy through an overlay (overlays/kind or overlays/aws), which sets the
# image and adds monitoring.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: stormproof
resources:
  - statefulset.yaml
  - services.yaml
  - pdb.yaml
